/*
 * Optional mirror configuration for networks where the official Android
 * repositories are slow. Usage:
 *   gradlew.bat --init-script china-mirrors.init.gradle :app:assembleDebug
 */
beforeSettings { settings ->
    settings.pluginManagement.repositories.clear()
    settings.pluginManagement.repositories {
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

settingsEvaluated { settings ->
    settings.dependencyResolutionManagement.repositories.clear()
    settings.dependencyResolutionManagement.repositories {
        maven { url = 'https://maven.aliyun.com/repository/google' }
        maven { url = 'https://maven.aliyun.com/repository/central' }
        google()
        mavenCentral()
        maven { url = 'https://jfrog.takuad.com/artifactory/china_sdk' }
    }
}
