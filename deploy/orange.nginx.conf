log_format orange '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name orange.lingzidev.com orange-api.lingzidev.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name orange.lingzidev.com;
    include /etc/nginx/snippets/orange-mail-locations.conf;
    ssl_certificate /etc/nginx/ssl/orange.lingzidev.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/orange.lingzidev.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/orange-rewards/current/web/dist;
    index index.html;
    access_log /var/log/nginx/orange.access.log orange;
    error_log /var/log/nginx/orange.error.log;
    client_max_body_size 1m;

    location = /api/integration/products {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:38180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/orange-rewards/proxy-token.conf;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/admin/products {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:38180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/orange-rewards/proxy-token.conf;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /media/products/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:38180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/orange-rewards/proxy-token.conf;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/integration/product-images {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:38180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/orange-rewards/proxy-token.conf;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /docs/product-api { try_files /index.html =404; }
    location = /docs/PRODUCT-API.md {
        types { text/markdown md; }
        charset utf-8;
        add_header Content-Disposition 'attachment; filename="PRODUCT-API.md"';
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control no-cache;
        try_files $uri =404;
    }
    location ^~ /api/mail-sso/ { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:38180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/orange-rewards/proxy-token.conf;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    # Downloads: the backend answers 302 to a signed COS URL (download domain) when COS is
    # enabled and has the file; any 404/5xx falls back to the local copy below.
    location /download/ {
        proxy_pass http://127.0.0.1:38180/api/cos/download/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/orange-rewards/proxy-token.conf;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @local_download;
    }
    location @local_download {
        root /var/www;
        rewrite ^/download/(.*)$ /orange-downloads/$1 break;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment; filename=\"xiaochengyouxi.apk\"; filename*=UTF-8''%E5%B0%8F%E6%A9%99%E6%9C%89%E5%96%9C.apk";
        add_header Cache-Control 'no-store';
    }
    location /assets/ { try_files $uri =404; }
    location = / { try_files /index.html =404; }
    location = /admin { try_files /index.html =404; }
    location = /admin/ { try_files /index.html =404; }
    location = /privacy { try_files /privacy.html =404; }
    location = /terms { try_files /terms.html =404; }
    location = /invite { try_files /index.html =404; }
    location /i/ { try_files /index.html =404; }
    location / { try_files $uri =404; }
}

